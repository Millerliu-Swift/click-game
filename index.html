
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #eaf2ff;
      padding: 50px 20px;
    }
    h1 { color: #2457a7; }
    #score { font-size: 30px; }
    button {
      padding: 14px 24px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
    }
    #start { background: #34a853; color: white; }
    #click { background: #4285f4; color: white; }
  </style>
</head>
<body>
  <h1>🎮 Click Game!</h1>
  <p>Click as many times as you can in 10 seconds!</p>
  <h2>Score: <span id="score">0</span></h2>
  <h2>Time: <span id="time">10</span>s</h2>

  <button id="start" onclick="startGame()">Start Game</button>
  <button id="click" onclick="addPoint()" disabled>Click Me!</button>
  <p id="message">Ready? Let's play!</p>

  <script>
    let score = 0;
    let timeLeft = 10;
    let playing = false;
    let timer;

    function startGame() {
      clearInterval(timer);
      score = 0;
      timeLeft = 10;
      playing = true;
      document.getElementById("score").textContent = score;
      document.getElementById("time").textContent = timeLeft;
      document.getElementById("message").textContent = "Go!";
      document.getElementById("click").disabled = false;
      document.getElementById("start").disabled = true;

      timer = setInterval(function() {
        timeLeft--;
        document.getElementById("time").textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          playing = false;
          document.getElementById("click").disabled = true;
          document.getElementById("start").disabled = false;
          document.getElementById("message").textContent =
            "Game over! Your score is " + score + "!";
        }
      }, 1000);
    }

    function addPoint() {
      if (!playing) return;
      score++;
      document.getElementById("score").textContent = score;
    }
  </script>
</body>
</html>
